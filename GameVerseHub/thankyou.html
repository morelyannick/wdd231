<!DOCTYPE html>

  <link rel="icon" href="images/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles/main.css">

</head>
<body>
  <a class="skip-link" href="#main">Skip to main content</a>

  <header class="site-header">
    <nav class="nav-container" aria-label="Main navigation">
      <a href="index.html" class="logo" aria-label="GameVerse Hub home">
        <img src="images/logo.svg" alt="GameVerse Hub logo" width="220" height="60">
      </a>
      <button class="nav-toggle" aria-label="Toggle navigation menu" aria-expanded="false" aria-controls="primary-menu">
        <span class="nav-toggle-icon" aria-hidden="true">☰</span>
      </button>
      <div class="nav-menu" id="primary-menu">
        <a href="index.html">Home</a>

      <div style="display:flex; gap:var(--spacing-md); justify-content:center; margin-top:var(--spacing-lg); flex-wrap:wrap;">
        <a href="index.html" class="btn btn-primary">Back to Home</a>
        <a href="library.html" class="btn btn-secondary">Browse Library</a>
